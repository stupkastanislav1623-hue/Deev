name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/myapp-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/myapp-frontend
  K8S_NAMESPACE: default

jobs:
  # ==================== TEST JOB ====================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm chart
        run: |
          cd helm-chart/myapp-chart
          helm lint .
          helm template test . --debug

      - name: Validate Dockerfiles
        run: |
          docker build -t backend-test ./backend
          docker build -t frontend-test ./frontend
          docker run --rm backend-test php -v
          docker run --rm frontend-test nginx -v

  # ==================== BUILD JOB ====================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== DEPLOY JOB ====================
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > $HOME/.kube/config

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          cd helm-chart/myapp-chart
          helm upgrade --install myapp . \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --set backend.image.repository=${{ env.BACKEND_IMAGE }} \
            --set backend.image.tag=latest \
            --set frontend.image.repository=${{ env.FRONTEND_IMAGE }} \
            --set frontend.image.tag=latest \
            --set frontend.autoscaling.enabled=true \
            --set backend.autoscaling.enabled=true

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/frontend -n ${{ env.K8S_NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/backend -n ${{ env.K8S_NAMESPACE }} --timeout=120s
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get hpa -n ${{ env.K8S_NAMESPACE }}

  # ==================== NOTIFICATION ====================
  notify:
    name: Send notification
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
