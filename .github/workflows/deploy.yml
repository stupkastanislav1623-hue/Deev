name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/myapp-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/myapp-frontend

jobs:
  test:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: |
          cd helm-chart/myapp-chart
          helm lint .

      - name: Validate Dockerfiles
        run: |
          docker build -t backend-test ./backend
          docker build -t frontend-test ./frontend
          docker run --rm backend-test php -v
          docker run --rm frontend-test nginx -v

  build:
    name: 📦 Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Show image info
        run: |
          echo "✅ Images pushed successfully!"
          echo "📦 Backend: ${{ env.BACKEND_IMAGE }}:latest"
          echo "📦 Frontend: ${{ env.FRONTEND_IMAGE }}:latest"
          echo "🔗 Docker Hub: https://hub.docker.com/u/${{ secrets.DOCKER_USERNAME }}"

  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()
    steps:
      - name: Success message
        if: needs.build.result == 'success'
        run: |
          echo "🎉 CI/CD Pipeline completed successfully!"
          echo "✅ Tests passed"
          echo "✅ Images built and pushed"
          echo ""
          echo "🔧 To deploy locally, run:"
          echo "   cd helm-chart/myapp-chart"
          echo "   helm upgrade --install myapp . --namespace default --create-namespace"

      - name: Failure message
        if: needs.build.result == 'failure'
        run: |
          echo "❌ CI/CD Pipeline failed!"
          echo "Please check the logs above."
