name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/myapp-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/myapp-frontend

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Lint Helm chart
        run: |
          cd helm-chart/myapp-chart
          helm lint .
      - name: Validate Dockerfiles
        run: |
          docker build -t backend-test ./backend
          docker build -t frontend-test ./frontend
          docker run --rm backend-test php -v
          docker run --rm frontend-test nginx -v

  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
      - name: Verify images
        run: |
          echo "✅ Images pushed successfully:"
          echo "  - ${{ env.BACKEND_IMAGE }}:latest"
          echo "  - ${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          echo "  - ${{ env.FRONTEND_IMAGE }}:latest"
          echo "  - ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"

  notify:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ CI/CD Pipeline completed successfully!"
            echo "📦 Images are available on Docker Hub"
            echo "🔧 To deploy locally, run: cd helm-chart/myapp-chart && helm upgrade --install myapp . --namespace default --create-namespace"
          else
            echo "❌ Build failed! Please check logs."
          fi
