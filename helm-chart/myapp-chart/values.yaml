frontend:
  enabled: true
  name: frontend
  replicaCount: 2
  image:
    repository: nginx
    tag: alpine
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 80
  config:
    nginxConf: |
      server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;
          index index.html;
          location / {
              try_files $uri $uri/ /index.html;
          }
          location /api/ {
              proxy_pass http://backend:9000/;
              proxy_set_header Host $host;
          }
      }

backend:
  enabled: true
  name: backend
  replicaCount: 2
  image:
    repository: php
    tag: 8.2-fpm-alpine
  service:
    type: ClusterIP
    port: 9000
    targetPort: 9000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 80
  env:
    DB_HOST: database
    DB_PORT: "3306"
    DB_NAME: app_db
    DB_USER: app_user

database:
  enabled: true
  name: database
  replicaCount: 1
  image:
    repository: mysql
    tag: "8.0"
  service:
    type: ClusterIP
    port: 3306
    targetPort: 3306
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: standard
  mysql:
    rootPassword: "rootpass123"
    database: app_db
    user: app_user
    password: "secret123"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: app.127.0.0.1.nip.io
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port:
                number: 80
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 9000